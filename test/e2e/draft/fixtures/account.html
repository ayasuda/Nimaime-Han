<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Account settings</title>
    <style>
      .invisible {
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <!-- A page with every kind of landmark nimaime draft groups elements by. -->
    <header>
      <a href="/">Acme</a>
      <nav aria-label="Primary">
        <a href="/home">Home</a>
        <a href="/settings">Settings</a>
        <a href="/help"><img src="data:," alt="Help" /></a>
      </nav>
    </header>
    <main>
      <h1>Account settings</h1>
      <section aria-labelledby="profile-title">
        <h2 id="profile-title">Profile</h2>
        <dl>
          <dt>Username</dt>
          <dd data-testid="username">alice</dd>
          <dt>Plan</dt>
          <dd data-testid="plan">Pro</dd>
          <dd data-testid="secret" hidden>hidden value</dd>
          <dd data-testid="ghost" class="invisible">invisible value</dd>
        </dl>
      </section>
      <form name="preferences">
        <label for="lang">Language</label>
        <select id="lang">
          <option>English</option>
          <option>日本語</option>
        </select>
        <label><input type="checkbox" checked /> Email notifications</label>
        <input type="search" placeholder="Search settings" />
        <input type="password" aria-label="Current password" />
        <button type="submit" disabled>Save</button>
        <button type="reset">Reset</button>
        <div role="button" aria-disabled="true">Delete account</div>
      </form>
      <section>
        <p>A section without a heading is not a landmark.</p>
        <button data-testid="export-button">Export data</button>
      </section>
      <div id="shadow-host"></div>
    </main>
    <dialog><button>Close</button></dialog>
    <footer>
      <a href="/terms">Terms</a>
    </footer>
    <script>
      const root = document.getElementById('shadow-host').attachShadow({ mode: 'open' });
      root.innerHTML = '<button>Shadow action</button>';
    </script>
  </body>
</html>
